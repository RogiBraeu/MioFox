:root {
  --font: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --bg: #FFF6EC; --card: #FFFFFF; --ink: #2E2A33; --muted: #7A7280; --line: #EADFD3; --radius: 18px;
  --primary: #FF7F2A; --primary-dark: #D9620F; --ok: #3DB46D; --ok-dark: #2A8A50; --ok-bg: #E2F7E9;
  --bad: #F2994A; --bad-dark: #C46A1C; --bad-bg: #FFF0E0; --gold: #E9A400;
  --review: #3A6FD8; --review-bg: #E5EEFF; --new: #8A4FD6; --new-bg: #F1E8FF; --spell: #C2338A; --spell-bg: #FDE6F3;
  --hl: #FFE27A; --say-bg: #FFE8D4; --sel-bg: #FFF1E3; --tricky: #B5179E; --tricky-bg: #FFD9F3; --hint-bg: #FFF4C7;
}
/* ===== Gemeinsames Aussehen (Farben über Variablen je App) ===== */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 20px; line-height: 1.35;
  -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
input { font: inherit; }
.wrap { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(32px + env(safe-area-inset-bottom)); }

.btn { display: block; width: 100%; border: none; border-radius: var(--radius); padding: 14px 18px; font-weight: 800;
  background: var(--card); color: var(--ink); box-shadow: 0 4px 0 var(--line); margin-top: 10px; transition: transform .06s; }

/* ===== Lektion ===== */
#lesson { position: fixed; inset: 0; background: var(--bg); z-index: 50; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top); }

.ls-fill { height: 100%; width: 0; background: var(--ok); border-radius: 99px; transition: width .35s; }
.ls-xp { font-weight: 800; color: var(--gold); min-width: 64px; text-align: right; }

.badges { margin: 4px 0 10px; }
.badge { display: inline-block; font-size: 16px; font-weight: 800; padding: 5px 12px; border-radius: 99px; }
.badge.review { background: var(--review-bg); color: var(--review); }

.badge.spell { background: var(--spell-bg); color: var(--spell); }
.instr { font-size: 24px; font-weight: 800; margin: 6px 0 18px; }

.prompt { background: var(--card); border-radius: var(--radius); padding: 22px 18px; margin-bottom: 18px; box-shadow: 0 3px 0 var(--line);
  display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; text-align: center; }
.big-word { font-size: 34px; font-weight: 800; }
.big-word.de { color: var(--ink); }
.sentence { font-size: 25px; font-weight: 700; line-height: 1.5; }
.sentence.de { font-weight: 600; }
.gap { display: inline-block; min-width: 90px; border-bottom: 4px solid var(--primary); color: transparent; }
.hl { background: var(--hl); padding: 0 6px; border-radius: 8px; }
.help-de { text-align: center; color: var(--muted); margin: -8px 0 16px; font-size: 18px; }

.options { display: grid; gap: 12px; }
.opt { min-height: 62px; border: 3px solid var(--line); background: var(--card); border-radius: var(--radius); font-size: 22px; font-weight: 700;
  padding: 10px 14px; box-shadow: 0 4px 0 var(--line); text-align: center; }
.opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.opt.right { border-color: var(--ok); background: var(--ok-bg); box-shadow: 0 4px 0 var(--ok); }
.opt.wrong { border-color: var(--bad); background: var(--bad-bg); box-shadow: 0 4px 0 var(--bad); }

  box-shadow: 0 3px 0 var(--line); padding: 0; }

.listen-row { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 10px 0 18px; }

.type-in { width: 100%; font-size: 28px; padding: 14px 16px; border: 3px solid var(--line); border-radius: var(--radius); background: var(--card);
  color: var(--ink); outline: none; text-align: center; }

.tile-pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

.slots { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 4px 0 26px; }
.slot { width: 44px; height: 56px; border: none; border-bottom: 4px solid var(--line); background: var(--card); border-radius: 10px 10px 4px 4px;
  font-size: 28px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; padding: 0; }
.slot.filled { border-bottom-color: var(--primary); }

.slots.right .slot.filled { border-bottom-color: var(--ok); background: var(--ok-bg); }
.slots.wrong .slot.filled { border-bottom-color: var(--bad); }

.gapword { display: flex; justify-content: center; align-items: flex-end; flex-wrap: wrap; gap: 3px; font-size: 38px; font-weight: 800; margin: 8px 0 10px; }
.gl { padding: 0 1px; }
.gapin { width: 46px; height: 58px; font-size: 32px; font-weight: 800; text-align: center; border: 3px solid var(--primary); border-radius: 10px;
  background: var(--card); color: var(--ink); outline: none; padding: 0; }
.gapin.right { border-color: var(--ok); background: var(--ok-bg); } .gapin.wrong { border-color: var(--bad); background: var(--bad-bg); }

.mcard { min-height: 64px; border: 3px solid var(--line); background: var(--card); border-radius: var(--radius); font-size: 19px; font-weight: 700;

/* Neues Wort */
.intro-card { background: var(--card); border-radius: var(--radius); padding: 24px 18px; box-shadow: 0 4px 0 var(--line); text-align: center; }

.ex-en { font-size: 22px; font-weight: 700; }
.ex-de { font-size: 18px; color: var(--muted); margin-top: 4px; }
.tricky { background: var(--tricky-bg); color: var(--tricky); border-radius: 6px; padding: 0 2px; }
.hint { background: var(--hint-bg); border-radius: 14px; padding: 10px 14px; margin: 12px 0 4px; font-size: 18px; font-weight: 600; text-align: left; }

/* Rückmeldung */
.ls-sheet { position: absolute; left: 0; right: 0; bottom: 0; padding: 16px 16px calc(18px + env(safe-area-inset-bottom));
  border-radius: 24px 24px 0 0; animation: up .22s ease-out; box-shadow: 0 -6px 24px rgba(0,0,0,.12); max-height: 75%; overflow-y: auto; }

.ls-sheet > * { max-width: 528px; margin-left: auto; margin-right: auto; }
.ls-sheet.ok { background: var(--ok-bg); } .ls-sheet.bad { background: var(--bad-bg); }
@keyframes up { from { transform: translateY(100%); } to { transform: none; } }
.sheet-row { display: flex; gap: 12px; align-items: flex-start; }
.sheet-mio { width: 86px; flex: none; }
.sheet-txt { flex: 1; min-width: 0; }
.sheet-title { font-size: 24px; font-weight: 800; }
.ok .sheet-title { color: var(--ok-dark); } .bad .sheet-title { color: var(--bad-dark); }
.sheet-detail { font-size: 19px; margin-top: 4px; }
.gain { font-weight: 800; color: var(--gold); margin-top: 6px; }
.again { margin-top: 8px; font-size: 17px; color: var(--muted); }
.full-sent { font-weight: 700; margin-top: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spelled { font-size: 28px; font-weight: 800; letter-spacing: 1px; }
.bad .spelled .bad, .spelled .bad { background: var(--bad); color: #fff; border-radius: 5px; padding: 0 2px; }
.spelled .good { background: var(--ok); color: #fff; border-radius: 5px; padding: 0 2px; }
.cmp-row { margin: 4px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cmp-l { font-size: 16px; color: var(--muted); width: 64px; }
.note { font-size: 16px; margin-top: 6px; }

/* Lektionsende */
.finish { text-align: center; padding-top: 10px; }
.finish-mio { width: 180px; margin: 0 auto; }
.finish h2 { font-size: 32px; margin: 8px 0 18px; color: var(--primary-dark); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--card); border-radius: var(--radius); padding: 14px 6px; box-shadow: 0 3px 0 var(--line); }
.stat b { display: block; font-size: 30px; color: var(--primary-dark); }
.stat span { font-size: 15px; color: var(--muted); font-weight: 700; }
.refreshed { margin-top: 18px; text-align: left; }
.ref-title { font-weight: 800; margin-bottom: 8px; font-size: 18px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: var(--review-bg); color: var(--review); border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 17px; }

/* Dialog */
.ls-dialog, .dialog { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 80; padding: 20px; }
.ls-dialog[hidden], .dialog[hidden] { display: none; }
.dlg-box { background: var(--bg); border-radius: 24px; padding: 20px; max-width: 400px; width: 100%; text-align: center; }
.dlg-box .mio { width: 110px; }
.dlg-title { font-size: 24px; font-weight: 800; margin: 6px 0; }

/* Mio */
.mio { width: 100%; height: auto; display: block; overflow: visible; }
.mio .eyes-happy, .mio .mouth-open, .mio .brows { display: none; }
.mio.cheer .eyes-open, .mio.party .eyes-open { display: none; }
.mio.cheer .eyes-happy, .mio.party .eyes-happy, .mio.cheer .mouth-open, .mio.party .mouth-open { display: inline; }
.mio.cheer .mouth-smile, .mio.party .mouth-smile { display: none; }
.mio.encourage .brows { display: inline; }
.mio .mio-head, .mio .mio-tail { transform-box: fill-box; }
.mio .mio-head { transform-origin: 50% 90%; }
.mio .mio-tail { transform-origin: 0% 100%; animation: wag 1.6s ease-in-out infinite; }
.mio.idle { animation: breathe 3s ease-in-out infinite; transform-origin: 50% 100%; }
.mio.cheer { animation: hop .6s ease-out 2; transform-origin: 50% 100%; }
.mio.party { animation: hop .55s ease-out infinite; transform-origin: 50% 100%; }
.mio.party .mio-tail { animation: wag .35s ease-in-out infinite; }
.mio.encourage .mio-head { animation: tilt 1.4s ease-in-out 1 forwards; }
@keyframes wag { 50% { transform: rotate(-12deg); } }
@keyframes breathe { 50% { transform: scale(1.03, .97); } }
@keyframes hop { 0%, 100% { transform: translateY(0); } 35% { transform: translateY(-16%) scale(1.04); } 60% { transform: translateY(0) scale(1.06, .94); } }
@keyframes tilt { 30% { transform: rotate(-9deg); } 100% { transform: rotate(-6deg); } }

.confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 100; }

/* Gemeinsame Bausteine der Startseiten */
.bubble { position: relative; background: var(--card); border-radius: 18px; padding: 12px 16px; font-weight: 700; box-shadow: 0 3px 0 var(--line); }
.progress { height: 14px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: var(--ok); border-radius: 99px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px; border-bottom: 2px solid var(--line); font-weight: 700; }
.switch { width: 64px; height: 36px; border-radius: 99px; border: none; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px; border-radius: 50%; background: #fff; transition: left .15s; }
.switch.on { background: var(--ok); } .switch.on::after { left: 32px; }
@media (prefers-reduced-motion: reduce) { .mio, .mio * { animation: none !important; } }

.pwa-banner { position: fixed; left: 0; right: 0; top: 0; z-index: 60; padding: calc(8px + env(safe-area-inset-top)) 10px 8px; pointer-events: none; }

.pwa-btn { border: none; background: var(--primary); color: #fff; font-weight: 800; border-radius: 12px; padding: 10px 14px; font-size: 17px; box-shadow: 0 3px 0 var(--primary-dark); }
.pwa-x { position: absolute; right: 6px; top: 6px; border: none; background: none; font-size: 20px; color: var(--muted); width: 32px; height: 32px; padding: 0; }
body.in-lesson .pwa-banner { display: none; }
.bk-title { font-weight: 800; font-size: 20px; margin: 0 0 4px; }

  padding: 8px; margin-top: 10px; background: #fff; color: var(--ink); word-break: break-all; resize: vertical; }
.bk-err { color: var(--bad-dark); font-weight: 700; min-height: 1em; }

.top { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.brand { flex: 1; font-weight: 800; font-size: 20px; line-height: 1.15; }
.pill { font-weight: 800; background: var(--card); border-radius: 99px; padding: 6px 12px; box-shadow: 0 2px 0 var(--line); font-size: 18px; }
.pill.gold { color: var(--gold); } .pill.fire { color: #E8590C; }

.test-banner { background: #FFF4C7; border-radius: 12px; padding: 8px 12px; font-size: 16px; font-weight: 700; text-align: center; margin-bottom: 10px; }

.rc-title { font-weight: 800; font-size: 21px; color: var(--review); }

.set-card .sc-title { font-weight: 800; font-size: 22px; margin-bottom: 10px; }

/* =====================================================================
   ÜBUNGSKERN (gemeinsam für Mio-App und Zoo-App)
   ===================================================================== */
const CONFIG = {
  PACK_SIZE: 8,            // neue Wörter pro Päckchen (bei zu langen Lektionen auf 6 senken)
  REVIEW_PER_LESSON: 8,    // Wiederholungswörter pro Lektion (5 bis 10)
  REVIEW_AFTER_BREAK: 5,   // nach langer Pause weniger Wiederholung
  BREAK_DAYS: 7,           // ab so vielen Tagen Pause gilt es als "lange Pause"
  REVIEW_LESSON_SIZE: 12,  // Wörter im reinen Wiederholungsmodus
  XP_CORRECT: 10,
  XP_RETRY: 5,
  XP_LESSON: 20,
  XP_COMBO: 5,
  COMBO: 5,
  INTERVALS: [0, 1, 2, 4, 7, 14, 30, 60] // Tage pro Stufe (Box)
};

/* ---------- Hilfsfunktionen ---------- */
const U = {
  esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); },
  shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; },
  pick(a) { return a[Math.floor(Math.random() * a.length)]; },
  today() { const d = new Date(); return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5); },
  chunk(a, n) { const r = []; for (let i = 0; i < a.length; i += n) r.push(a.slice(i, i + n)); return r; },
  norm(s) {
    return String(s).toLowerCase().replace(/[’`´]/g, "'").replace(/[.,!?;:"()]/g, " ").replace(/\s+/g, " ").trim();
  },
  stripArticle(s) { return s.replace(/^(to|a|an|the) /, ""); },
  lev(a, b) {
    const m = a.length, n = b.length, d = [];
    for (let i = 0; i <= m; i++) { d[i] = [i]; }
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++)
      d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    return d;
  },
  /* Vergleicht Antwort und Ziel Buchstabe für Buchstabe.
     Liefert: welche Buchstaben der Antwort falsch sind, welche im Ziel fehlen/anders sind */
  diff(ans, target) {
    const a = ans.toLowerCase(), b = target.toLowerCase();
    const d = U.lev(a, b);
    let i = a.length, j = b.length;
    const badA = new Set(), badB = new Set();
    while (i > 0 || j > 0) {
      if (i > 0 && j > 0 && a[i - 1] === b[j - 1] && d[i][j] === d[i - 1][j - 1]) { i--; j--; }
      else if (i > 0 && j > 0 && d[i][j] === d[i - 1][j - 1] + 1) { badA.add(i - 1); badB.add(j - 1); i--; j--; }
      else if (i > 0 && d[i][j] === d[i - 1][j] + 1) { badA.add(i - 1); i--; }
      else { badB.add(j - 1); if (j > 0) j--; else i--; }
    }
    return { badA, badB, dist: d[a.length][b.length] };
  },
  /* "fr[ie]nd" -> Set{2,3} */
  trickySet(w) {
    const s = new Set();
    if (!w.mark) return s;
    let plain = "", inB = false;
    for (const c of w.mark) {
      if (c === "[") { inB = true; continue; }
      if (c === "]") { inB = false; continue; }
      if (inB) s.add(plain.length);
      plain += c;
    }
    return plain === w.en ? s : new Set();
  },
  /* Wort mit farbigen Buchstaben */
  letters(text, set, cls) {
    return [...text].map((c, i) => set && set.has(i) ? `<span class="${cls}">${U.esc(c)}</span>` : U.esc(c)).join("");
  },
  wordRegex(en) { return new RegExp("(^|[^A-Za-z'])(" + en.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![A-Za-z])", "i"); },
  inputAttrs: 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"'
};

/* ---------- Daten ---------- */
const Data = {
  sets: [], words: [], byId: {},
  load(sets) {
    this.sets = sets.map(s => {
      const words = s.words.map((w, i) => Object.assign({}, w, { id: s.id + ":" + w.en, setId: s.id, order: i, ex: w.ex || [] }));
      return Object.assign({}, s, { words });
    });
    this.words = this.sets.flatMap(s => s.words);
    this.words.forEach(w => this.byId[w.id] = w);
  },
  set(id) { return this.sets.find(s => s.id === id); },
  sentencesWith(w) { return w.ex.filter(e => U.wordRegex(w.en).test(e.en)); }
};

/* ---------- Speicher (nur auf diesem Gerät) ---------- */
const Store = {
  key: "vokabeln", data: null,
  defaults() {
    return { v: 1, words: {}, xp: 0, streak: 0, lastLessonDay: null, lastPlayDay: null,
      packsDone: {}, settings: { sound: true, speech: true }, app: {} };
  },
  load(key) {
    this.key = key;
    let d = null;
    try { d = JSON.parse(localStorage.getItem(key)); } catch (e) { d = null; }
    this.data = Object.assign(this.defaults(), d || {});
    this.data.settings = Object.assign(this.defaults().settings, this.data.settings || {});
  },
  save() { try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* kein Speicher verfügbar */ } },
  reset() { this.data = this.defaults(); this.save(); },
  w(id) {
    let s = this.data.words[id];
    if (!s) s = this.data.words[id] = { box: 0, due: 0, wrong: 0, mWrong: 0, sWrong: 0, hard: false, seen: 0 };
    return s;
  }
};

/* ---------- Lernstand & Planung ---------- */
const Plan = {
  isLearned(w) { const s = Store.data.words[w.id]; return !!(s && s.box >= 1); },
  isHard(w) { const s = Store.data.words[w.id]; return !!(w.problem || (s && s.hard)); },
  interval(box, hard) {
    const base = CONFIG.INTERVALS[Math.min(box, CONFIG.INTERVALS.length - 1)];
    return hard ? Math.max(1, Math.floor(base / 2)) : base;
  },
  setProgress(setId) {
    const set = Data.set(setId);
    const learned = set.words.filter(w => this.isLearned(w)).length;
    return { learned, total: set.words.length };
  },
  packs(setId) {
    const set = Data.set(setId);
    const chunks = U.chunk(set.words, CONFIG.PACK_SIZE);
    let prevDone = true;
    return chunks.map((words, index) => {
      const learned = words.filter(w => this.isLearned(w)).length;
      const done = learned === words.length;
      const started = words.some(w => Store.data.words[w.id] && Store.data.words[w.id].seen > 0);
      const unlocked = prevDone;
      prevDone = done;
      return { setId, index, words, learned, done, started, unlocked };
    });
  },
  nextPack(setId) { return this.packs(setId).find(p => p.unlocked && !p.done) || null; },
  packsDoneToday() { return Store.data.packsDone[U.today()] || 0; },
  dueWords() {
    const t = U.today();
    return Data.words.filter(w => { const s = Store.data.words[w.id]; return s && s.box >= 1 && s.due <= t; })
      .sort((a, b) => (this.isHard(b) - this.isHard(a)) || (Store.data.words[a.id].due - Store.data.words[b.id].due));
  },
  learnedWords() { return Data.words.filter(w => this.isLearned(w)); },
  daysSinceLastLesson() {
    const l = Store.data.lastLessonDay;
    return l == null ? 0 : U.today() - l;
  },
  reviewCount() {
    return this.daysSinceLastLesson() >= CONFIG.BREAK_DAYS ? CONFIG.REVIEW_AFTER_BREAK : CONFIG.REVIEW_PER_LESSON;
  },
  streak() {
    const d = Store.data;
    if (d.lastLessonDay == null) return 0;
    return U.today() - d.lastLessonDay <= 1 ? d.streak : 0;
  },
  /* Ergebnis eines Wiederholungsworts (erster Versuch zählt) */
  reviewResult(w, ok, part) {
    const s = Store.w(w.id);
    s.seen++;
    if (ok) {
      s.box = Math.min(CONFIG.INTERVALS.length - 1, s.box + 1);
      if (s.box >= 4) s.hard = false;
    } else {
      s.wrong++;
      if (part === "s") s.sWrong++; else s.mWrong++;
      s.box = Math.max(1, s.box - 2);
      s.hard = true;
    }
    s.due = U.today() + (ok ? this.interval(s.box, this.isHard(w)) : 1);
    Store.save();
  },
  /* Neues Wort: beide Teile geschafft */
  newLearned(w, mistakes) {
    const s = Store.w(w.id);
    s.box = 1;
    if (mistakes >= 2) s.hard = true;
    s.due = U.today() + 1;
    Store.save();
  },
  markSeen(w) { const s = Store.w(w.id); s.seen++; Store.save(); },
  /* Stufe der Rechtschreibaufgabe: 1 Kacheln, 2 Lückenwort, 3 Hören+Tippen */
  spellLevel(w, isNew) {
    if (isNew) return 1;
    const s = Store.data.words[w.id] || { box: 0 };
    let lvl = s.box >= 5 ? 3 : s.box >= 3 ? 2 : 1;
    if (this.isHard(w)) lvl = Math.max(1, lvl - 1);
    return lvl;
  },
  lessonFinished() {
    const d = Store.data, t = U.today();
    if (d.lastLessonDay === t) { /* schon heute */ }
    else if (d.lastLessonDay === t - 1) d.streak = (d.streak || 0) + 1;
    else d.streak = 1;
    d.lastLessonDay = t;
    Store.save();
  },
  addXP(n) { Store.data.xp += n; Store.save(); if (Engine.onXP) Engine.onXP(n); }
};

/* ---------- Lektionen zusammenstellen ---------- */
const Builder = {
  pickReview(n, exclude) {
    const ex = new Set((exclude || []).map(w => w.id));
    return Plan.dueWords().filter(w => !ex.has(w.id)).slice(0, n);
  },
  newLesson(setId, packIndex) {
    const pack = Plan.packs(setId)[packIndex];
    const newWords = pack.words.filter(w => !Plan.isLearned(w));
    const rv = this.pickReview(Plan.reviewCount(), pack.words);
    // leichte Wörter zuerst (hohe Box)
    const sorted = rv.slice().sort((a, b) => Store.data.words[b.id].box - Store.data.words[a.id].box);
    const warmN = rv.length >= 6 ? 3 : Math.min(2, rv.length);
    const warm = sorted.slice(0, warmN);
    const rest = U.shuffle(sorted.slice(warmN));
    const endN = Math.min(3, Math.floor(rest.length / 2));
    const end = rest.splice(rest.length - endN, endN);
    const mid = rest;
    const items = [];
    warm.forEach(w => items.push({ kind: "task", w, part: "m", review: true, easy: true }));
    const pairs = U.chunk(U.shuffle([]).concat(newWords), 2);
    pairs.forEach((pair, i) => {
      pair.forEach(w => items.push({ kind: "intro", w }));
      pair.forEach(w => items.push({ kind: "task", w, part: "m", isNew: true }));
      if (i > 0) pairs[i - 1].forEach(w => items.push({ kind: "task", w, part: "s", isNew: true }));
      if (mid.length) { const w = mid.shift(); items.push({ kind: "task", w, part: this.reviewPart(w), review: true }); }
    });
    if (pairs.length) pairs[pairs.length - 1].forEach(w => items.push({ kind: "task", w, part: "s", isNew: true }));
    if (newWords.length >= 4) items.push({ kind: "match", words: U.shuffle(newWords).slice(0, 4) });
    mid.forEach(w => items.push({ kind: "task", w, part: this.reviewPart(w), review: true }));
    end.forEach(w => items.push({ kind: "task", w, part: this.reviewPart(w), review: true, easy: true }));
    return { kind: "new", setId, packIndex, items, newWords, reviewWords: rv };
  },
  reviewPart(w) {
    const s = Store.data.words[w.id] || {};
    if ((s.sWrong || 0) > (s.mWrong || 0)) return "s";
    if ((s.mWrong || 0) > (s.sWrong || 0)) return "m";
    return Math.random() < 0.5 ? "s" : "m";
  },
  /* Reiner Wiederholungsmodus (alle Sets) */
  reviewLesson(n, fillWeak) {
    let words = this.pickReview(n || CONFIG.REVIEW_LESSON_SIZE);
    if (fillWeak && words.length < n) {
      const have = new Set(words.map(w => w.id));
      const weak = Plan.learnedWords().filter(w => !have.has(w.id))
        .sort((a, b) => (Plan.isHard(b) - Plan.isHard(a)) || (Store.data.words[a.id].box - Store.data.words[b.id].box));
      words = words.concat(U.shuffle(weak.slice(0, Math.max(n * 2, 8))).slice(0, n - words.length));
    }
    if (!words.length) return null;
    words = U.shuffle(words);
    const items = [];
    words.forEach((w, i) => {
      items.push({ kind: "task", w, part: i < 2 ? "m" : this.reviewPart(w), review: true, easy: i < 2 });
      if (i === Math.floor(words.length / 2) && words.length >= 6) {
        items.push({ kind: "match", words: U.shuffle(words).slice(0, 4), review: true });
      }
    });
    return { kind: "review", items, newWords: [], reviewWords: words };
  }
};

/* ---------- Ton (kleiner Jingle ohne Dateien) ---------- */
const Sound = {
  ctx: null,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.ctx = null; } }
    if (this.ctx && this.ctx.state === "suspended") this.ctx.resume().catch(() => {});
    return this.ctx;
  },
  tone(freq, start, dur, type, vol) {
    const c = this.ctx; const o = c.createOscillator(); const g = c.createGain();
    o.type = type || "triangle"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(vol || 0.18, c.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    o.connect(g); g.connect(c.destination); o.start(c.currentTime + start); o.stop(c.currentTime + start + dur + 0.05);
  },
  play(name) {
    if (!Store.data.settings.sound) return;
    if (!this.ensure()) return;
    try {
      if (name === "correct") { this.tone(659, 0, .14); this.tone(988, .09, .22); }
      else if (name === "wrong") { this.tone(392, 0, .16, "sine", .12); this.tone(330, .12, .22, "sine", .1); }
      else if (name === "combo") { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .08, .2)); }
      else if (name === "finish") { [523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone(f, i * .11, .26, "triangle", .2)); }
      else if (name === "tap") { this.tone(880, 0, .05, "sine", .06); }
      else if (name === "trumpet") { this.tone(233, 0, .22, "sawtooth", .09); this.tone(311, .18, .22, "sawtooth", .09); this.tone(466, .38, .55, "sawtooth", .11); }
      else if (name === "coin") { this.tone(988, 0, .08, "square", .07); this.tone(1319, .07, .18, "square", .07); }
    } catch (e) {}
  }
};

/* ---------- Vorlesen (Sprachausgabe des Handys) ---------- */
const Speech = {
  voice: null,
  get ok() { return "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined"; },
  init() {
    if (!this.ok) return;
    const choose = () => {
      const vs = speechSynthesis.getVoices();
      this.voice = vs.find(v => /en[-_]GB/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
    };
    choose();
    try { speechSynthesis.addEventListener("voiceschanged", choose); } catch (e) { speechSynthesis.onvoiceschanged = choose; }
  },
  say(text, slow) {
    if (!this.ok || !Store.data.settings.speech) return;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = this.voice ? this.voice.lang : "en-GB";
      if (this.voice) u.voice = this.voice;
      u.rate = slow ? 0.6 : 0.9;
      speechSynthesis.speak(u);
    } catch (e) {}
  },
  btn(text, cls) { return this.ok && Store.data.settings.speech ? `<button class="say ${cls || ""}" data-say="${U.esc(text)}" aria-label="Vorlesen">🔊</button>` : ""; }
};

/* ---------- Konfetti ---------- */
const Confetti = {
  canvas: null, parts: [], running: false,
  burst(n) {
    if (!this.canvas) {
      this.canvas = document.createElement("canvas"); this.canvas.className = "confetti";
      document.body.appendChild(this.canvas);
    }
    const c = this.canvas; c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio;
    const cols = ["#FF8A3D", "#FFD23F", "#3BC9A0", "#4D96FF", "#FF6B9A", "#A78BFA"];
    for (let i = 0; i < (n || 80); i++) this.parts.push({
      x: c.width * (0.2 + Math.random() * 0.6), y: c.height * 0.35, vx: (Math.random() - .5) * 16 * devicePixelRatio,
      vy: (-Math.random() * 14 - 6) * devicePixelRatio, s: (6 + Math.random() * 6) * devicePixelRatio, r: Math.random() * 6,
      vr: (Math.random() - .5) * .4, col: U.pick(cols), life: 0 });
    if (!this.running) { this.running = true; requestAnimationFrame(() => this.step()); }
  },
  step() {
    const c = this.canvas, g = c.getContext("2d");
    g.clearRect(0, 0, c.width, c.height);
    this.parts.forEach(p => { p.vy += .45 * devicePixelRatio; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; p.life++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.col; g.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); g.restore(); });
    this.parts = this.parts.filter(p => p.y < c.height + 40 && p.life < 240);
    if (this.parts.length) requestAnimationFrame(() => this.step());
    else { this.running = false; g.clearRect(0, 0, c.width, c.height); }
  }
};

          <path d="M69 50 Q75 41 81 50" stroke="#2B1D16" stroke-width="3.4" fill="none" stroke-linecap="round"/></g>
        <g class="brows"><path d="M38 38 L50 41" stroke="#5A3A2A" stroke-width="2.6" stroke-linecap="round"/>
          <path d="M82 38 L70 41" stroke="#5A3A2A" stroke-width="2.6" stroke-linecap="round"/></g>
        <ellipse cx="60" cy="66" rx="5.2" ry="3.8" fill="#3B2A22"/>
        <path class="mouth-smile" d="M53 71 Q60 77 67 71" stroke="#3B2A22" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        <path class="mouth-open" d="M53 71 Q60 82 67 71 Z" fill="#7A2E2E" stroke="#3B2A22" stroke-width="1.6"/>
      </g></svg>`;
  },
  praise: ["Great job!", "You nailed it!", "Awesome!", "Well done!", "Super!", "Fantastic!", "Brilliant!", "Way to go!", "Excellent!", "Perfect!", "Nice one!", "You're a star!"],
  cheerUp: ["Not quite – no problem!", "Good try!", "Almost!", "Keep going!", "You'll get it next time!"],
  retry: ["Second try, you've got this!", "Let's try that again!", "You can do it!", "One more time!"],
  combo: ["You're on fire!", "Unstoppable!", "Amazing streak!", "Wow, what a run!"],
  /* Mio-Reaktion in einem Container auslösen */
  react(el, mood) {
    if (!el) return;
    const svg = el.querySelector(".mio");
    if (!svg) return;
    svg.classList.remove("cheer", "encourage", "party", "idle");
    void svg.getBoundingClientRect();
    svg.classList.add(mood);
  }
};

/* ---------- Lektion abspielen ---------- */
const Lesson = {
  plan: null, root: null, queue: [], idx: 0, opts: null, st: null,

  start(plan, opts) {
    this.plan = plan; this.opts = opts || {};
    // XP pro Lektion einstellbar (z. B. weniger XP für Übungen am Gehege)
    this.xp = Object.assign({ correct: CONFIG.XP_CORRECT, retry: CONFIG.XP_RETRY, lesson: CONFIG.XP_LESSON, combo: CONFIG.XP_COMBO }, this.opts.xp || {});
    this.queue = plan.items.slice(); this.idx = 0;
    this.st = { xp: 0, combo: 0, correctFirst: 0, answered: 0, mOk: {}, sOk: {}, mistakes: {}, attempts: {},
      usedTypes: {}, usedSentences: {}, endRetry: {}, learnedNow: [], reviewed: new Map(), firstDone: {} };
    Store.data.lastPlayDay = U.today(); Store.save();
    this.root = document.getElementById("lesson");
    this.root.innerHTML = `
      <div class="ls-top">
        <button class="ls-close" aria-label="Lektion beenden">✕</button>
        <div class="ls-bar"><div class="ls-fill"></div></div>
        <div class="ls-xp">⭐ <span>0</span></div>
      </div>
      <div class="ls-body"></div>
      <div class="ls-foot"></div>
      <div class="ls-sheet" hidden></div>
      <div class="ls-dialog" hidden></div>`;
    this.root.hidden = false;
    document.body.classList.add("in-lesson");
    this.root.querySelector(".ls-close").onclick = () => this.askQuit();
    this.render();
  },

  askQuit() {
    const d = this.root.querySelector(".ls-dialog");
    d.hidden = false;
    d.innerHTML = `<div class="dlg-box">${Mio.svg("encourage")}
      <p class="dlg-title">Wirklich aufhören?</p>
      <p>Deine XP sind gespeichert. Gelernte Wörter bleiben gelernt.</p>
      <button class="btn primary big" data-a="stay">Weiterlernen</button>
      <button class="btn ghost" data-a="quit">Aufhören</button></div>`;
    d.querySelector('[data-a="stay"]').onclick = () => { d.hidden = true; };
    d.querySelector('[data-a="quit"]').onclick = () => this.close(false);
  },

  close(completed) {
    try { if (Speech.ok) speechSynthesis.cancel(); } catch (e) {}
    this.root.hidden = true; this.root.innerHTML = "";
    document.body.classList.remove("in-lesson");
    const res = { completed, xp: this.st.xp, plan: this.plan, learned: this.st.learnedNow, reviewed: [...this.st.reviewed.keys()] };
    if (this.opts.onClose) this.opts.onClose(res);
  },

  progress() {
    const total = this.queue.length, done = this.idx;
    this.root.querySelector(".ls-fill").style.width = Math.round(100 * done / Math.max(1, total)) + "%";
    this.root.querySelector(".ls-xp span").textContent = this.st.xp;
  },

  render() {
    this.progress();
    const sheet = this.root.querySelector(".ls-sheet"); sheet.hidden = true; sheet.className = "ls-sheet";
    if (this.idx >= this.queue.length) return this.finish();
    const item = this.queue[this.idx];
    const body = this.root.querySelector(".ls-body"), foot = this.root.querySelector(".ls-foot");
    body.scrollTop = 0; foot.innerHTML = "";
    if (item.kind === "intro") return this.renderIntro(item, body, foot);
    if (item.kind === "match") return Ex.match(item, body, foot);
    const type = Ex.chooseType(item);
    item.type = type;
    Ex[type](item, body, foot);
  },

  badges(item) {
    let b = "";
    if (item.retry) b += `<span class="badge retry">💪 ${U.esc(item.retryMsg || (item.retryMsg = U.pick(Mio.retry)))}</span>`;
    else if (item.review) b += `<span class="badge review">🔁 Wiederholung</span>`;
    else if (item.isNew && item.part === "s") b += `<span class="badge spell">✏️ Rechtschreibung</span>`;
    return b ? `<div class="badges">${b}</div>` : "";
  },

  renderIntro(item, body, foot) {
    const w = item.w;
    if (!item.again) Plan.markSeen(w);
    const tricky = U.trickySet(w);
    const ex = w.ex[0];
    body.innerHTML = `
      <div class="badges">${item.again ? `<span class="badge retry">👀 Schau noch einmal genau hin</span>` : `<span class="badge new">✨ Neues Wort</span>`}</div>
      <div class="intro-card">
        <div class="intro-word"><span>${U.letters(w.en, tricky, "tricky")}</span> ${Speech.btn(w.en)}</div>
        <div class="intro-de">${U.esc(w.de)}</div>
        ${tricky.size ? `<div class="intro-tip">Achtung bei den <span class="tricky">farbigen</span> Buchstaben!</div>` : ""}
        ${w.hint ? `<div class="hint">💡 ${U.esc(w.hint)}</div>` : ""}
        ${ex ? `<div class="intro-ex"><div class="ex-en">${U.esc(ex.en)} ${Speech.btn(ex.en, "small")}</div><div class="ex-de">${U.esc(ex.de || "")}</div></div>` : ""}
      </div>`;
    Ex.bindSay(body);
    foot.innerHTML = `<button class="btn primary big" data-next>Weiter</button>`;
    foot.querySelector("[data-next]").onclick = () => { Sound.play("tap"); this.idx++; this.render(); };
    Speech.say(w.en);
  },

  /* Antwort auswerten */
  answer(item, ok, info) {
    info = info || {};
    const st = this.st, w = item.w;
    const key = item.kind === "match" ? "match" + this.idx : w.id + item.part;
    st.answered++;
    if (ok) {
      const first = !item.retry;
      const gain = first ? this.xp.correct : this.xp.retry;
      st.xp += gain; Plan.addXP(gain);
      if (first) st.correctFirst++;
      st.combo++;
    } else {
      st.combo = 0;
    }
    if (item.kind === "task") {
      st.usedTypes[w.id + item.part] = (st.usedTypes[w.id + item.part] || []).concat(item.type);
      // Wiederholungswort: nur der erste Versuch zählt für die Planung
      if (item.review && !st.firstDone[w.id]) {
        st.firstDone[w.id] = true;
        Plan.reviewResult(w, ok, item.part);
        st.reviewed.set(w.id, ok);
      }
      if (!ok) {
        st.mistakes[w.id] = (st.mistakes[w.id] || 0) + 1;
        this.scheduleRetry(item);
      } else {
        if (item.retry) this.dropCloseRetry(item);
        if (item.part === "m") st.mOk[w.id] = true; else st.sOk[w.id] = true;
        // Neues Wort: erst gelernt, wenn Bedeutung UND Schreibweise geklappt haben
        if ((item.isNew || item.wasNew) && st.mOk[w.id] && st.sOk[w.id] && !Plan.isLearned(w)) {
          Plan.newLearned(w, st.mistakes[w.id] || 0);
          st.learnedNow.push(w.id);
        }
      }
    }
    this.feedback(item, ok, info);
  },

  /* Falsches Wort neu einplanen: einmal nach ein paar Aufgaben und einmal am Ende –
     nie mehrfach direkt hintereinander */
  scheduleRetry(item) {
    const st = this.st, id = item.w.id, part = item.part, k = id + part;
    st.attempts[k] = (st.attempts[k] || 0) + 1;
    const same = q => q.kind !== "intro" && q.retry && q.w && q.w.id === id && q.part === part;
    // alte, noch offene Wiederholungen dieses Worts entfernen und neu planen
    this.queue = this.queue.filter((q, i) => i <= this.idx || !(same(q) || (q.again && q.w.id === id)));
    const base = { kind: "task", w: item.w, part, retry: true, review: item.review, wasNew: item.isNew || item.wasNew };
    const card = { kind: "intro", w: item.w, again: true };
    const help = st.attempts[k] >= 2; // nach zwei Fehlern: erst noch einmal die Lernkarte zeigen
    const others = this.queue.length - (this.idx + 1);
    if (others >= 3) {
      const pos = this.idx + 4;
      this.queue.splice(pos, 0, ...(help ? [card, Object.assign({}, base)] : [Object.assign({}, base)]));
      // noch einmal am Ende – aber nur, wenn genug andere Aufgaben dazwischen liegen
      if (this.queue.length - (pos + (help ? 2 : 1)) >= 2) this.queue.push(Object.assign({}, base, { endRetry: true }));
    } else {
      // kurz vor Schluss: ein, zwei andere Wörter dazwischenschieben, damit es nicht direkt wiederkommt
      const done = new Set(), fill = [];
      this.queue.slice(0, this.idx).forEach(q => { if (q.kind === "task" && q.w && q.w.id !== id && !done.has(q.w.id)) { done.add(q.w.id); fill.push(q.w); } });
      U.shuffle(fill).slice(0, Math.max(0, 2 - others)).forEach(w =>
        this.queue.push({ kind: "task", w, part: "m", review: true, easy: true, filler: true }));
      if (help) this.queue.push(card);
      this.queue.push(Object.assign({}, base, { endRetry: true }));
    }
  },

  /* nach richtiger Wiederholung: Abschluss-Wiederholung streichen, wenn sie direkt folgen würde */
  dropCloseRetry(item) {
    const id = item.w.id, part = item.part;
    const j = this.queue.findIndex((q, i) => i > this.idx && q.retry && q.w && q.w.id === id && q.part === part);
    if (j >= 0 && j - this.idx <= 2) this.queue.splice(j, 1);
  },

  feedback(item, ok, info) {
    const st = this.st;
    const sheet = this.root.querySelector(".ls-sheet");
    const foot = this.root.querySelector(".ls-foot");
    foot.innerHTML = "";
    let combo = ok && st.combo > 0 && st.combo % CONFIG.COMBO === 0;
    if (combo && this.xp.combo) { st.xp += this.xp.combo; Plan.addXP(this.xp.combo); }
    this.progress();
    let title, text = "";
    if (ok) {
      title = combo ? `🔥 ${st.combo} in a row! ${U.pick(Mio.combo)}` : (info.near ? "Almost perfect!" : U.pick(Mio.praise));
      if (info.near) text = `Fast richtig – zählt! So schreibt man es: <b>${U.esc(info.correct)}</b>`;
      else if (info.correctHtml) text = info.correctHtml;
      const g = item.retry ? this.xp.retry : this.xp.correct;
      if (!info.noGain && g > 0) text += `<div class="gain">+${g} XP${combo && this.xp.combo ? ` &nbsp;+${this.xp.combo} Bonus` : ""}</div>`;
      Sound.play(combo ? "combo" : "correct");
      Confetti.burst(combo ? 140 : 45);
    } else {
      title = info.spell ? "Fast! Schau dir die Stelle genau an." : U.pick(Mio.cheerUp);
      text = info.html || (info.correct ? `Richtig ist: <b>${U.esc(info.correct)}</b>` : "");
      if (item.w && item.w.hint) text += `<div class="hint">💡 ${U.esc(item.w.hint)}</div>`;
      text += `<div class="again">Kein Problem – das kommt gleich noch einmal.</div>`;
      Sound.play("wrong");
    }
    sheet.className = "ls-sheet " + (ok ? "ok" : "bad");
    sheet.innerHTML = `<div class="sheet-row"><div class="sheet-mio">${Mio.svg(ok ? (combo ? "party" : "cheer") : "encourage")}</div>
      <div class="sheet-txt"><div class="sheet-title">${title}</div><div class="sheet-detail">${text}</div></div></div>
      <button class="btn big ${ok ? "primary" : "warm"}" data-next>Weiter</button>`;
    sheet.hidden = false;
    sheet.querySelectorAll("[data-say]").forEach(b => b.onclick = () => Speech.say(b.dataset.say));
    const next = sheet.querySelector("[data-next]");
    next.onclick = () => { Sound.play("tap"); this.idx++; this.render(); };
    next.focus({ preventScroll: true });
    if (info.sayAfter) Speech.say(info.sayAfter);
  },

  finish() {
    const st = this.st;
    if (this.xp.lesson) { st.xp += this.xp.lesson; Plan.addXP(this.xp.lesson); }
    Plan.lessonFinished();
    if (this.plan.kind === "new") {
      const pack = Plan.packs(this.plan.setId)[this.plan.packIndex];
      if (pack && pack.done) { const t = U.today(); Store.data.packsDone[t] = (Store.data.packsDone[t] || 0) + 1; Store.save(); }
    }
    Sound.play("finish"); Confetti.burst(160); setTimeout(() => Confetti.burst(120), 600);
    const body = this.root.querySelector(".ls-body"), foot = this.root.querySelector(".ls-foot");
    this.root.querySelector(".ls-fill").style.width = "100%";
    const acc = st.answered ? Math.round(100 * st.correctFirst / Math.max(1, st.answered)) : 100;
    const refreshed = [...st.reviewed.keys()].map(id => Data.byId[id]);
    body.innerHTML = `<div class="finish">
      <div class="finish-mio">${Mio.svg("party")}</div>
      <h2>${U.esc(this.opts.finishTitle || "Lesson complete!")}</h2>
      <div class="stats">
        <div class="stat"><b>+${st.xp}</b><span>XP</span></div>
        <div class="stat"><b>${Plan.streak()}</b><span>🔥 Tage</span></div>
        <div class="stat"><b>${st.learnedNow.length}</b><span>neue Wörter</span></div>
      </div>
      ${refreshed.length ? `<div class="refreshed"><div class="ref-title">Wörter, die wir heute aufgefrischt haben:</div>
        <div class="chips">${refreshed.map(w => `<span class="chip">${U.esc(w.en)}</span>`).join("")}</div></div>` : ""}
      ${this.opts.finishExtra ? this.opts.finishExtra(st) : ""}
    </div>`;
    foot.innerHTML = `<button class="btn primary big" data-done>Fertig</button>`;
    foot.querySelector("[data-done]").onclick = () => this.close(true);
  }
};

/* ---------- Übungsarten ---------- */
const Ex = {
  chooseType(item) {
    const w = item.w, st = Lesson.st;
    const k = w.id + item.part;
    const used = st.usedTypes[k] || [];
    const attempts = st.attempts[k] || 0;
    if (item.part === "s") {
      let lvl = Plan.spellLevel(w, item.isNew || item.wasNew);
      if (attempts >= 2) lvl = 1;
      if (lvl === 3 && !(Speech.ok && Store.data.settings.speech)) lvl = 2;
      if (lvl === 2 && item.retry && used.includes("spell_gap") && attempts >= 1) lvl = 1;
      return ["spell_tiles", "spell_gap", "spell_listen"][lvl - 1];
    }
    const hasS = Data.sentencesWith(w).length > 0;
    const hasDeS = w.ex.some(e => e.de && e.en.split(" ").length <= 9);
    let c;
    if (item.easy) c = ["mc_en_de", "mc_de_en"];
    else if (item.isNew) c = ["mc_en_de", "mc_de_en", hasS && "cloze_mc", hasS && "context", hasDeS && "sentence_tiles"];
    else c = ["mc_en_de", "mc_de_en", "translate_type", hasS && "cloze_mc", hasS && "context", hasDeS && "sentence_tiles"];
    c = c.filter(Boolean);
    if (attempts >= 2) c = c.filter(t => t.startsWith("mc_") || t === "cloze_mc" || t === "context");
    const count = t => used.filter(x => x === t).length;
    const min = Math.min(...c.map(count));
    let pool = c.filter(t => count(t) === min);
    if (pool.length > 1) pool = pool.filter(t => t !== used[used.length - 1]);
    return U.pick(pool);
  },

  head(item, instr) {
    return Lesson.badges(item) + `<div class="instr">${instr}</div>`;
  },

  distractors(w, field, n) {
    const same = Data.words.filter(x => x.id !== w.id && x.setId === w.setId && x[field].toLowerCase() !== w[field].toLowerCase());
    const other = Data.words.filter(x => x.id !== w.id && x.setId !== w.setId && x[field].toLowerCase() !== w[field].toLowerCase());
    const pool = U.shuffle(same).concat(U.shuffle(other));
    const out = [], seen = new Set([w[field].toLowerCase()]);
    for (const x of pool) { if (!seen.has(x[field].toLowerCase())) { seen.add(x[field].toLowerCase()); out.push(x); } if (out.length >= n) break; }
    return out;
  },

  sentence(item, needDe) {
    const w = item.w, st = Lesson.st;
    let list = Data.sentencesWith(w);
    if (needDe) list = w.ex.filter(e => e.de && e.en.split(" ").length <= 9);
    const used = st.usedSentences[w.id] || [];
    const fresh = list.filter(e => !used.includes(e.en));
    const s = U.pick(fresh.length ? fresh : list);
    st.usedSentences[w.id] = used.concat(s.en);
    return s;
  },

  bindSay(root) { root.querySelectorAll("[data-say]").forEach(b => b.onclick = e => { e.stopPropagation(); Speech.say(b.dataset.say, b.classList.contains("slow")); }); },

  mcOptions(item, body, opts, correctIdx, onDone) {
    const box = body.querySelector(".options");
    box.innerHTML = opts.map((o, i) => `<button class="opt" data-i="${i}">${o}</button>`).join("");
    let locked = false;
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (locked) return; locked = true;
      const i = +b.dataset.i, ok = i === correctIdx;
      b.classList.add(ok ? "right" : "wrong");
      box.children[correctIdx].classList.add("right");
      box.querySelectorAll(".opt").forEach(x => x.disabled = true);
      onDone(ok);
    });
  },

  mc_en_de(item, body) {
    const w = item.w;
    const ds = this.distractors(w, "de", 3);
    const all = U.shuffle([w].concat(ds));
    body.innerHTML = this.head(item, "Was heißt das auf Deutsch?") +
      `<div class="prompt big-word">${U.esc(w.en)} ${Speech.btn(w.en)}</div><div class="options"></div>`;
    this.bindSay(body);
    this.mcOptions(item, body, all.map(x => U.esc(x.de)), all.indexOf(w), ok => Lesson.answer(item, ok, { correct: w.de }));
    Speech.say(w.en);
  },

  mc_de_en(item, body) {
    const w = item.w;
    const ds = this.distractors(w, "en", 3);
    const all = U.shuffle([w].concat(ds));
    body.innerHTML = this.head(item, "Wähle das englische Wort.") +
      `<div class="prompt big-word de">${U.esc(w.de)}</div><div class="options"></div>`;
    this.mcOptions(item, body, all.map(x => U.esc(x.en)), all.indexOf(w), ok => Lesson.answer(item, ok, { correct: w.en, sayAfter: w.en }));
  },

  cloze_mc(item, body) {
    const w = item.w, s = this.sentence(item);
    const html = U.esc(s.en).replace(U.wordRegex(U.esc(w.en)), (m, pre) => pre + `<span class="gap">_____</span>`);
    const ds = this.distractors(w, "en", 2);
    const all = U.shuffle([w].concat(ds));
    body.innerHTML = this.head(item, "Welches Wort passt in die Lücke?") +
      `<div class="prompt sentence">${html}</div>${s.de ? `<div class="help-de">${U.esc(s.de)}</div>` : ""}<div class="options"></div>`;
    this.mcOptions(item, body, all.map(x => U.esc(x.en)), all.indexOf(w), ok => Lesson.answer(item, ok, {
      correctHtml: `<div class="full-sent">${U.esc(s.en)} ${Speech.btn(s.en, "small")}</div>`,
      html: `Richtig ist: <b>${U.esc(w.en)}</b><div class="full-sent">${U.esc(s.en)} ${Speech.btn(s.en, "small")}</div>`,
      sayAfter: s.en }));
  },

  context(item, body) {
    const w = item.w, s = this.sentence(item);
    const html = U.esc(s.en).replace(U.wordRegex(U.esc(w.en)), (m, pre, word) => pre + `<span class="hl">${word}</span>`);
    const ds = this.distractors(w, "de", 3);
    const all = U.shuffle([w].concat(ds));
    body.innerHTML = this.head(item, "Was bedeutet das farbige Wort?") +
      `<div class="prompt sentence">${html} ${Speech.btn(s.en, "small")}</div><div class="options"></div>`;
    this.bindSay(body);
    this.mcOptions(item, body, all.map(x => U.esc(x.de)), all.indexOf(w), ok => Lesson.answer(item, ok, { correct: w.de }));
  },

  /* Übersetzen (Bedeutung): Tippfehler sind erlaubt */
  translate_type(item, body, foot) {
    const w = item.w;
    body.innerHTML = this.head(item, "Schreib das Wort auf Englisch.") +
      `<div class="prompt big-word de">${U.esc(w.de)}</div>
       <input class="type-in" type="text" ${U.inputAttrs} placeholder="auf Englisch …">`;
    const inp = body.querySelector("input");
    foot.innerHTML = `<button class="btn primary big" data-check disabled>Prüfen</button>`;
    const btn = foot.querySelector("[data-check]");
    inp.oninput = () => btn.disabled = !inp.value.trim();
    const check = () => {
      if (!inp.value.trim()) return;
      inp.disabled = true; btn.disabled = true;
      const a = U.stripArticle(U.norm(inp.value)), t = U.stripArticle(U.norm(w.en));
      const dist = U.lev(a, t)[a.length][t.length];
      const tol = t.length <= 3 ? 0 : t.length <= 7 ? 1 : 2;
      const exact = dist === 0;
      const ok = dist <= tol;
      inp.classList.add(ok ? "right" : "wrong");
      Lesson.answer(item, ok, { near: ok && !exact, correct: w.en, sayAfter: w.en });
    };
    btn.onclick = check;
    inp.onkeydown = e => { if (e.key === "Enter") check(); };
    setTimeout(() => inp.focus(), 50);
  },

  /* Satz übersetzen mit Wortkacheln */
  sentence_tiles(item, body, foot) {
    const w = item.w, s = this.sentence(item, true);
    const clean = s.en.replace(/[.!?]+$/, "");
    const end = s.en.slice(clean.length);
    const words = clean.split(" ");
    const others = Data.words.filter(x => x.id !== w.id).flatMap(x => x.ex.map(e => e.en.replace(/[.!?]+$/, "").split(" "))).flat()
      .filter(t => !words.map(x => x.toLowerCase()).includes(t.toLowerCase()) && /^[a-z']+$/i.test(t));
    const extra = U.shuffle([...new Set(others)]).slice(0, 2);
    const tiles = U.shuffle(words.concat(extra)).map((t, i) => ({ t, i }));
    body.innerHTML = this.head(item, "Bau den Satz auf Englisch.") +
      `<div class="prompt sentence de">${U.esc(s.de)}</div>
       <div class="answer-line"></div><div class="tile-pool"></div>`;
    const line = body.querySelector(".answer-line"), pool = body.querySelector(".tile-pool");
    const chosen = [];
    foot.innerHTML = `<button class="btn primary big" data-check disabled>Prüfen</button>`;
    const btn = foot.querySelector("[data-check]");
    const draw = () => {
      line.innerHTML = chosen.map((c, k) => `<button class="tile word" data-k="${k}">${U.esc(c.t)}</button>`).join("") || `<span class="placeholder">Tippe die Wörter an</span>`;
      pool.innerHTML = tiles.map(c => `<button class="tile word ${chosen.includes(c) ? "used" : ""}" data-i="${c.i}" ${chosen.includes(c) ? "disabled" : ""}>${U.esc(c.t)}</button>`).join("");
      line.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { chosen.splice(+b.dataset.k, 1); Sound.play("tap"); draw(); });
      pool.querySelectorAll("[data-i]").forEach(b => b.onclick = () => { chosen.push(tiles.find(c => c.i === +b.dataset.i)); Sound.play("tap"); draw(); });
      btn.disabled = !chosen.length;
    };
    draw();
    btn.onclick = () => {
      btn.disabled = true;
      line.querySelectorAll("button").forEach(b => b.disabled = true); pool.querySelectorAll("button").forEach(b => b.disabled = true);
      const ok = U.norm(chosen.map(c => c.t).join(" ")) === U.norm(clean);
      line.classList.add(ok ? "right" : "wrong");
      Lesson.answer(item, ok, {
        correctHtml: `<div class="full-sent">${U.esc(clean + end)} ${Speech.btn(s.en, "small")}</div>`,
        html: `Richtig ist:<div class="full-sent">${U.esc(clean + end)} ${Speech.btn(s.en, "small")}</div>`,
        sayAfter: s.en });
    };
  },

  /* Karten zuordnen */
  match(item, body, foot) {
    const words = item.words;
    const left = U.shuffle(words), right = U.shuffle(words);
    body.innerHTML = Lesson.badges(item) + `<div class="instr">Finde die Paare.</div>
      <div class="match"><div class="mcol">${left.map(w => `<button class="mcard" data-id="${U.esc(w.id)}" data-side="en">${U.esc(w.en)}</button>`).join("")}</div>
      <div class="mcol">${right.map(w => `<button class="mcard" data-id="${U.esc(w.id)}" data-side="de">${U.esc(w.de)}</button>`).join("")}</div></div>`;
    let sel = null, done = 0, errors = 0;
    const wrongIds = new Set();
    body.querySelectorAll(".mcard").forEach(b => b.onclick = () => {
      if (b.classList.contains("done")) return;
      if (b.dataset.side === "en") Speech.say(Data.byId[b.dataset.id].en);
      if (!sel) { sel = b; b.classList.add("sel"); Sound.play("tap"); return; }
      if (sel === b) { b.classList.remove("sel"); sel = null; return; }
      if (sel.dataset.side === b.dataset.side) { sel.classList.remove("sel"); sel = b; b.classList.add("sel"); return; }
      if (sel.dataset.id === b.dataset.id) {
        sel.classList.remove("sel"); sel.classList.add("done"); b.classList.add("done"); Sound.play("correct"); done++;
      } else {
        errors++;
        const enCard = sel.dataset.side === "en" ? sel : b;
        wrongIds.add(enCard.dataset.id);
        [sel, b].forEach(x => { x.classList.remove("sel"); x.classList.add("shake"); setTimeout(() => x.classList.remove("shake"), 450); });
        Sound.play("wrong");
      }
      sel = null;
      if (done === words.length) {
        // falsch zugeordnete Wörter kommen als Bedeutungsaufgabe wieder
        wrongIds.forEach(id => Lesson.scheduleRetry({ w: Data.byId[id], part: "m", review: item.review, isNew: !item.review }));
        const ok = errors === 0;
        const st = Lesson.st;
        st.answered++;
        if (ok) { st.correctFirst++; st.combo++; st.xp += Lesson.xp.correct; Plan.addXP(Lesson.xp.correct); } else st.combo = 0;
        Lesson.feedback({ kind: "match", w: null, retry: false }, true, errors ? { noGain: true, correctHtml: `Alle Paare gefunden! Die vertauschten Wörter üben wir gleich noch einmal.` } : {});
      }
    });
  },

  /* ---- Rechtschreibung ---- */
  spellFeedback(item, ans) {
    const w = item.w;
    const d = U.diff(ans, w.en);
    const ok = d.dist === 0;
    const caseNote = ok && ans !== w.en ? `<div class="note">Achtung: So schreibt man es genau: <b>${U.esc(w.en)}</b></div>` : "";
    const tricky = U.trickySet(w);
    Lesson.answer(item, ok, ok ? {
      correctHtml: `<div class="spelled">${U.letters(w.en, tricky, "tricky")} ${Speech.btn(w.en, "small")}</div>${caseNote}`, sayAfter: w.en
    } : {
      spell: true, sayAfter: w.en,
      html: `<div class="cmp"><div class="cmp-row"><span class="cmp-l">Du:</span> <span class="spelled">${U.letters(ans || "–", d.badA, "bad")}</span></div>
             <div class="cmp-row"><span class="cmp-l">Richtig:</span> <span class="spelled">${U.letters(w.en, d.badB, "good")}</span> ${Speech.btn(w.en, "small")}</div></div>`
    });
  },

  spell_tiles(item, body, foot) {
    const w = item.w, st = Lesson.st;
    const chars = [...w.en];
    const slots = chars.map((c, i) => /[A-Za-z]/.test(c) ? null : c); // Leerzeichen/Apostroph sind fest
    const needed = chars.filter(c => /[A-Za-z]/.test(c));
    const extraN = (item.isNew || item.wasNew || (st.attempts[w.id + "s"] || 0) >= 2) ? 0 : Math.min(3, Math.ceil(needed.length / 4));
    const alpha = "abcdefghiklmnoprstuwy";
    const extra = []; for (let i = 0; i < extraN; i++) extra.push(U.pick([...alpha]));
    const tiles = U.shuffle(needed.concat(extra)).map((c, i) => ({ c, i }));
    body.innerHTML = this.head(item, "Setz das Wort aus den Buchstaben zusammen.") +
      `<div class="prompt big-word de">${U.esc(w.de)} ${Speech.btn(w.en)}</div>
       <div class="slots"></div><div class="tile-pool letters"></div>`;
    this.bindSay(body);
    const slotsEl = body.querySelector(".slots"), pool = body.querySelector(".tile-pool");
    const placed = []; // Kacheln in Reihenfolge
    foot.innerHTML = `<button class="btn primary big" data-check disabled>Prüfen</button>`;
    const btn = foot.querySelector("[data-check]");
    const draw = () => {
      let k = 0;
      slotsEl.innerHTML = chars.map((c, i) => {
        if (slots[i] !== null) return c === " " ? `<span class="slot space"></span>` : `<span class="slot fixed">${U.esc(c)}</span>`;
        const t = placed[k++];
        return `<button class="slot ${t ? "filled" : ""}" ${t ? `data-k="${k - 1}"` : "disabled"}>${t ? U.esc(t.c) : ""}</button>`;
      }).join("");
      pool.innerHTML = tiles.map(t => `<button class="tile letter ${placed.includes(t) ? "used" : ""}" data-i="${t.i}" ${placed.includes(t) ? "disabled" : ""}>${U.esc(t.c)}</button>`).join("");
      slotsEl.querySelectorAll("[data-k]").forEach(b => b.onclick = () => { placed.splice(+b.dataset.k, 1); Sound.play("tap"); draw(); });
      pool.querySelectorAll("[data-i]").forEach(b => b.onclick = () => {
        if (placed.length >= needed.length) return;
        placed.push(tiles.find(t => t.i === +b.dataset.i)); Sound.play("tap"); draw();
      });
      btn.disabled = placed.length !== needed.length;
    };
    draw();
    btn.onclick = () => {
      btn.disabled = true;
      body.querySelectorAll(".slots button, .tile-pool button").forEach(b => b.disabled = true);
      let k = 0;
      const ans = chars.map((c, i) => slots[i] !== null ? c : placed[k++].c).join("");
      slotsEl.classList.add(U.diff(ans, w.en).dist === 0 ? "right" : "wrong");
      this.spellFeedback(item, ans);
    };
    Speech.say(w.en);
  },

  spell_gap(item, body, foot) {
    const w = item.w;
    const chars = [...w.en];
    const letterIdx = chars.map((c, i) => /[A-Za-z]/.test(c) ? i : -1).filter(i => i >= 0);
    let gaps = [...U.trickySet(w)].filter(i => letterIdx.includes(i));
    const want = Math.min(letterIdx.length - 1, Math.max(1, Math.round(letterIdx.length / 4)));
    if (gaps.length > 3) gaps = gaps.slice(0, 3);
    const vowels = U.shuffle(letterIdx.filter(i => /[aeiouy]/i.test(chars[i]) && !gaps.includes(i) && i > 0));
    while (gaps.length < want && vowels.length) gaps.push(vowels.shift());
    const restI = U.shuffle(letterIdx.filter(i => !gaps.includes(i) && i > 0));
    while (gaps.length < want && restI.length) gaps.push(restI.shift());
    gaps.sort((a, b) => a - b);
    body.innerHTML = this.head(item, "Ergänze die fehlenden Buchstaben.") +
      `<div class="prompt big-word de">${U.esc(w.de)} ${Speech.btn(w.en)}</div>
       <div class="gapword">${chars.map((c, i) => gaps.includes(i) ? `<input class="gapin" maxlength="1" data-i="${i}" ${U.inputAttrs}>` : `<span class="gl">${c === " " ? "&nbsp;" : U.esc(c)}</span>`).join("")}</div>`;
    this.bindSay(body);
    const ins = [...body.querySelectorAll(".gapin")];
    foot.innerHTML = `<button class="btn primary big" data-check disabled>Prüfen</button>`;
    const btn = foot.querySelector("[data-check]");
    ins.forEach((inp, k) => {
      inp.oninput = () => {
        inp.value = inp.value.slice(-1);
        if (inp.value && ins[k + 1]) ins[k + 1].focus();
        btn.disabled = ins.some(x => !x.value);
      };
      inp.onkeydown = e => {
        if (e.key === "Backspace" && !inp.value && ins[k - 1]) ins[k - 1].focus();
        if (e.key === "Enter" && !btn.disabled) btn.click();
      };
    });
    btn.onclick = () => {
      btn.disabled = true; ins.forEach(x => x.disabled = true);
      const ans = chars.map((c, i) => gaps.includes(i) ? (body.querySelector(`.gapin[data-i="${i}"]`).value || "?") : c).join("");
      ins.forEach(x => x.classList.add(x.value.toLowerCase() === chars[+x.dataset.i].toLowerCase() ? "right" : "wrong"));
      this.spellFeedback(item, ans);
    };
    setTimeout(() => ins[0] && ins[0].focus(), 50);
  },

  spell_listen(item, body, foot) {
    const w = item.w;
    body.innerHTML = this.head(item, "Hör gut zu und schreib das Wort.") +
      `<div class="listen-row"><button class="say huge" data-say="${U.esc(w.en)}">🔊</button><button class="say slow" data-say="${U.esc(w.en)}" aria-label="Langsam">🐢</button></div>
       <button class="tipbtn">Tipp: auf Deutsch zeigen</button>
       <input class="type-in" type="text" ${U.inputAttrs} placeholder="Schreib, was du hörst …">`;
    this.bindSay(body);
    body.querySelector(".tipbtn").onclick = e => { e.target.outerHTML = `<div class="help-de">${U.esc(w.de)}</div>`; };
    const inp = body.querySelector("input");
    foot.innerHTML = `<button class="btn primary big" data-check disabled>Prüfen</button>`;
    const btn = foot.querySelector("[data-check]");
    inp.oninput = () => btn.disabled = !inp.value.trim();
    const check = () => { if (!inp.value.trim()) return; inp.disabled = true; btn.disabled = true; this.spellFeedback(item, inp.value.trim()); };
    btn.onclick = check;
    inp.onkeydown = e => { if (e.key === "Enter") check(); };
    Speech.say(w.en);
    setTimeout(() => inp.focus(), 50);
  }
};

/* =====================================================================
   PWA: Offline-Speicher, Update-Banner, Home-Bildschirm-Hinweis,
   dauerhafter Speicher und Sicherungscode (für beide Apps gleich)
   ===================================================================== */
const TEST_MODE = VOCAB_SETS.some(s => s.id.startsWith("test")) || location.hash === "#test";

const PWA = {
  prefix: "APP1",
  embedded: (() => { try { return window.self !== window.top; } catch (e) { return true; } })(),

  init(opts) {
    this.prefix = opts.prefix;
    this.persist();
    if (!this.embedded) { this.registerSW(); this.installHint(); }
  },

  /* Browser bitten, den Speicher nicht automatisch zu löschen */
  persist() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        navigator.storage.persisted().then(p => { if (!p) return navigator.storage.persist(); }).catch(() => {});
      }
    } catch (e) {}
  },

  /* Service Worker (Muster wie Familienbank: Update-Banner, skipWaiting per Nachricht) */
  registerSW() {
    if (!("serviceWorker" in navigator)) return;
    if (location.protocol !== "https:" && location.hostname !== "localhost" && location.hostname !== "127.0.0.1") return;
    navigator.serviceWorker.register("./sw.js").then(reg => {
      if (reg.waiting && navigator.serviceWorker.controller) this.updateBanner(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener("statechange", () => {
          if (nw.state === "installed" && navigator.serviceWorker.controller) this.updateBanner(nw);
        });
      });
      document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") reg.update().catch(() => {}); });
    }).catch(() => {});
    // nur neu laden, wenn das Kind auf "Jetzt aktualisieren" getippt hat (nicht beim allerersten Installieren)
    let reloading = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => { if (!this.updating || reloading) return; reloading = true; location.reload(); });
  },

  banner(html, cls) {
    const old = document.querySelector(".pwa-banner." + cls); if (old) old.remove();
    const b = document.createElement("div");
    b.className = "pwa-banner " + cls;
    b.innerHTML = `<div class="pwa-inner">${html}<button class="pwa-x" aria-label="Schließen">✕</button></div>`;
    b.querySelector(".pwa-x").onclick = () => b.remove();
    document.body.appendChild(b);
    return b;
  },

  updateBanner(worker) {
    const b = this.banner(`<div class="pwa-txt"><b>✨ Neue Version da!</b><br>Neue Wörter oder Verbesserungen.</div>
      <button class="pwa-btn" data-upd>Jetzt aktualisieren</button>`, "upd");
    b.querySelector("[data-upd]").onclick = () => { this.updating = true; worker.postMessage({ type: "SKIP_WAITING" }); b.remove(); };
  },

  isIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); },
  standalone() { return navigator.standalone === true || (window.matchMedia && matchMedia("(display-mode: standalone)").matches); },

  /* Hinweis: App auf den Home-Bildschirm legen (nur so bleibt der Fortschritt auf dem iPhone sicher) */
  installHint() {
    if (this.standalone()) return;
    let seen = false;
    try { seen = sessionStorage.getItem("pwa-hint") === "1"; sessionStorage.setItem("pwa-hint", "1"); } catch (e) {}
    if (this.isIOS() && !seen) {
      this.banner(`<div class="pwa-txt"><b>📲 Leg mich auf deinen Home-Bildschirm!</b><br>
        Nur so bleibt dein Fortschritt sicher gespeichert. Tippe in Safari auf <b>Teilen</b>
        <span class="pwa-share">⬆︎</span> und dann auf <b>„Zum Home-Bildschirm“</b>.</div>`, "ios");
    }
    window.addEventListener("beforeinstallprompt", e => {
      e.preventDefault();
      const b = this.banner(`<div class="pwa-txt"><b>📲 Als App installieren</b><br>Dann bleibt dein Fortschritt sicher gespeichert.</div>
        <button class="pwa-btn" data-inst>Installieren</button>`, "and");
      b.querySelector("[data-inst]").onclick = () => { e.prompt(); b.remove(); };
    });
  },

  /* ---------- Sicherungscode ---------- */
  b64(bytes) { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); },
  unb64(str) { const bin = atob(str), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; },
  async exportCode() {
    const json = JSON.stringify(Store.data);
    if (window.CompressionStream) {
      try {
        const cs = new Blob([json]).stream().pipeThrough(new CompressionStream("gzip"));
        return this.prefix + "z:" + this.b64(new Uint8Array(await new Response(cs).arrayBuffer()));
      } catch (e) {}
    }
    return this.prefix + ":" + this.b64(new TextEncoder().encode(json));
  },
  async importCode(code) {
    code = String(code).replace(/\s+/g, "");
    let json;
    if (code.startsWith(this.prefix + "z:")) {
      if (!window.DecompressionStream) throw new Error("Dieses Gerät kann den Code nicht lesen.");
      const ds = new Blob([this.unb64(code.slice(this.prefix.length + 2))]).stream().pipeThrough(new DecompressionStream("gzip"));
      json = await new Response(ds).text();
    } else if (code.startsWith(this.prefix + ":")) {
      json = new TextDecoder().decode(this.unb64(code.slice(this.prefix.length + 1)));
    } else throw new Error("Das ist kein Sicherungscode für diese App.");
    const d = JSON.parse(json);
    if (!d || typeof d !== "object" || typeof d.words !== "object") throw new Error("Der Code ist unvollständig.");
    return d;
  },

  backupSection() {
    return `<section class="card backup">
      <p class="bk-title">💾 Fortschritt sichern</p>
      <p class="small">Für ein neues Handy: Code erstellen, kopieren und dir selbst schicken. Auf dem neuen Handy hier einfügen.</p>
      <button class="btn" data-bk-make>Sicherungscode erstellen</button>
      <div data-bk-out></div>
      <button class="btn" data-bk-restore>Code einfügen und wiederherstellen</button>
    </section>`;
  },

  modal(html) {
    let d = document.getElementById("pwa-dlg");
    if (!d) { d = document.createElement("div"); d.id = "pwa-dlg"; d.className = "dialog pwa-dialog"; document.body.appendChild(d); }
    d.hidden = false; d.innerHTML = `<div class="dlg-box">${html}</div>`;
    const close = () => { d.hidden = true; d.innerHTML = ""; };
    d.querySelectorAll("[data-x]").forEach(b => b.onclick = close);
    d.onclick = e => { if (e.target === d) close(); };
    return d;
  },

  bindBackup(root) {
    const mk = root.querySelector("[data-bk-make]");
    if (mk) mk.onclick = async () => {
      const out = root.querySelector("[data-bk-out]");
      const code = await this.exportCode();
      out.innerHTML = `<textarea class="bk-code" readonly>${U.esc(code)}</textarea>
        <button class="btn primary" data-bk-copy>📋 Code kopieren</button>
        <p class="small">Schick dir den Code zum Beispiel als Nachricht. Er enthält nur deinen Lernstand – keine Namen.</p>`;
      const ta = out.querySelector("textarea");
      out.querySelector("[data-bk-copy]").onclick = async e => {
        try { await navigator.clipboard.writeText(code); e.target.textContent = "✓ Kopiert"; }
        catch (err) { ta.focus(); ta.select(); e.target.textContent = "Text ist markiert – jetzt kopieren"; }
      };
    };
    const rs = root.querySelector("[data-bk-restore]");
    if (rs) rs.onclick = () => {
      const d = this.modal(`<p class="dlg-title">Fortschritt wiederherstellen</p>
        <p class="small">Füge hier deinen Sicherungscode ein.</p>
        <textarea class="bk-code" data-bk-in ${U.inputAttrs}></textarea>
        <p class="bk-err" data-bk-err></p>
        <button class="btn primary big" data-bk-go>Wiederherstellen</button>
        <button class="btn ghost" data-x>Abbrechen</button>`);
      d.querySelector("[data-bk-go]").onclick = async () => {
        const err = d.querySelector("[data-bk-err]");
        try {
          const data = await this.importCode(d.querySelector("[data-bk-in]").value);
          const box = d.querySelector(".dlg-box");
          box.innerHTML = `<p class="dlg-title">Code ist gültig ✓</p>
            <p>Dein jetziger Fortschritt auf diesem Handy wird dabei <b>ersetzt</b>.</p>
            <button class="btn primary big" data-bk-ok>Ja, wiederherstellen</button><button class="btn ghost" data-x>Abbrechen</button>`;
          box.querySelector("[data-x]").onclick = () => { d.hidden = true; };
          box.querySelector("[data-bk-ok]").onclick = () => {
            Store.data = Object.assign(Store.defaults(), data); Store.save();
            location.reload();
          };
        } catch (e) { err.textContent = e.message && /Code|Gerät|App/.test(e.message) ? e.message : "Der Code stimmt nicht. Bitte ganz kopieren."; }
      };
    };
  }
};

/* =====================================================================
   MIO-APP: Startbildschirm, Sets, Päckchen, Einstellungen
   ===================================================================== */
const App = {
  view: "home", setId: null,

  init() {
    Engine.init({ storageKey: "mio-vokabeln-v1" });
    PWA.init({ prefix: "MIO1" });
    this.render();
  },

  header() {
    return `<header class="top">
      <div class="brand">Vokabeln mit Mio</div>
      <div class="pill gold">⭐ ${Store.data.xp}</div>
      <div class="pill fire">🔥 ${Plan.streak()}</div>
      <button class="icon" data-go="settings" aria-label="Einstellungen">⚙️</button>
    </header>`;
  },

  greeting() {
    const h = new Date().getHours();
    const s = Plan.streak();
    if (s >= 3) return `Wow, ${s} days in a row! Let's keep going!`;
    return h < 11 ? "Good morning! Ready to learn?" : h < 17 ? "Hi! Let's learn some words!" : "Good evening! A quick lesson?";
  },

  render() {
    const app = document.getElementById("app");
    if (this.view === "home") app.innerHTML = this.home();
    else if (this.view === "set") app.innerHTML = this.setView();
    else if (this.view === "settings") app.innerHTML = this.settings();
    this.bind(app);
    window.scrollTo(0, 0);
  },

  home() {
    const due = Plan.dueWords().length;
    return `${this.header()}
      ${TEST_MODE ? `<div class="test-banner">🧪 Testversion mit Testwörtern</div>` : ""}
      <div class="hero">
        <div class="hero-mio">${Mio.svg("idle")}</div>
        <div class="bubble">${U.esc(this.greeting())}</div>
      </div>
      <section class="card review-card">
        <div class="rc-title">🔁 Wiederholung</div>
        ${due ? `<div class="rc-text">Wörter, die wir heute auffrischen: <b>${due}</b></div>
          <button class="btn primary big" data-review>Wiederholen</button>`
        : Plan.learnedWords().length ? `<div class="rc-text">Alles aufgefrischt! ✓ Morgen gibt es neue Wiederholungswörter.</div>
          <button class="btn" data-review-extra>Trotzdem üben</button>`
        : `<div class="rc-text">Hier üben wir später die Wörter, die du schon gelernt hast.</div>`}
      </section>
      <h2 class="sec">Wähle dein Set</h2>
      ${Data.sets.map(s => { const p = Plan.setProgress(s.id); return `
        <button class="card set-card" data-set="${U.esc(s.id)}">
          <div class="sc-title">${U.esc(s.title)}</div>
          <div class="progress"><div style="width:${Math.round(100 * p.learned / p.total)}%"></div></div>
          <div class="sc-sub">${p.learned} von ${p.total} Wörtern gelernt ${p.learned === p.total ? "🏆" : ""}</div>
        </button>`; }).join("")}`;
  },

  setView() {
    const set = Data.set(this.setId);
    const p = Plan.setProgress(set.id);
    const packs = Plan.packs(set.id);
    const next = Plan.nextPack(set.id);
    const doneToday = Plan.packsDoneToday();
    let action;
    if (!next) action = `<div class="done-box">🏆 Alle Wörter in diesem Set gelernt!</div>
      <button class="btn primary big" data-review-extra>Wiederholen</button>`;
    else if (doneToday === 0 || next.started) action = `<button class="btn primary big" data-pack="${next.index}">
      ${next.started ? "Päckchen " + (next.index + 1) + " fortsetzen" : "Päckchen " + (next.index + 1) + " starten"}</button>`;
    else action = `<div class="done-box">🎉 Für heute geschafft! Morgen wartet das nächste Päckchen.</div>
      <button class="btn big" data-pack="${next.index}">Noch ein Päckchen</button>`;
    return `<header class="top"><button class="icon" data-go="home" aria-label="Zurück">←</button>
      <div class="brand">${U.esc(set.title)}</div><div class="pill gold">⭐ ${Store.data.xp}</div></header>
      <section class="card">
        <div class="progress"><div style="width:${Math.round(100 * p.learned / p.total)}%"></div></div>
        <div class="sc-sub">${p.learned} von ${p.total} Wörtern gelernt</div>
      </section>
      ${action}
      <h2 class="sec">Päckchen</h2>
      ${packs.map(k => `<div class="pack ${k.done ? "done" : k.unlocked ? "open" : "locked"}">
        <div class="pk-ico">${k.done ? "✅" : k.unlocked ? "📦" : "🔒"}</div>
        <div class="pk-txt"><b>Päckchen ${k.index + 1}</b><span>${k.words.length} Wörter · ${k.learned} gelernt</span></div>
      </div>`).join("")}`;
  },

  settings() {
    const s = Store.data.settings;
    return `<header class="top"><button class="icon" data-go="home" aria-label="Zurück">←</button><div class="brand">Einstellungen</div></header>
      <section class="card">
        <div class="toggle-row">Töne <button class="switch ${s.sound ? "on" : ""}" data-toggle="sound" aria-label="Töne"></button></div>
        <div class="toggle-row">Vorlesen <button class="switch ${s.speech ? "on" : ""}" data-toggle="speech" aria-label="Vorlesen"></button></div>
        ${Speech.ok ? `<button class="btn" data-testsay>🔊 Vorlesen testen</button>` : `<p class="small">Dieses Handy kann leider nicht vorlesen.</p>`}
      </section>
      <section class="card">
        <p class="small">Dein Fortschritt wird nur auf diesem Handy gespeichert. Es gibt kein Login und es werden keine Daten verschickt.</p>
        <button class="btn" data-reset>Fortschritt löschen</button>
        <p class="small">Version ${APP_VERSION}</p>
      </section>
      ${PWA.backupSection()}
      ${TEST_MODE ? `<section class="card test-tools">
        <p class="small"><b>Nur zum Testen:</b> Tut so, als wäre ein Tag vergangen. So kann man die Wiederholung ausprobieren.</p>
        <button class="btn" data-skipday>⏩ Einen Tag vorspulen</button>
      </section>` : ""}
      <div class="dialog" hidden></div>`;
  },

  bind(app) {
    app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => { this.view = b.dataset.go; this.render(); });
    app.querySelectorAll("[data-set]").forEach(b => b.onclick = () => { this.view = "set"; this.setId = b.dataset.set; this.render(); });
    const opts = { onClose: () => this.render() };
    app.querySelectorAll("[data-pack]").forEach(b => b.onclick = () => Engine.startNew(this.setId, +b.dataset.pack, opts));
    const r = app.querySelector("[data-review]");
    if (r) r.onclick = () => Engine.startReview(CONFIG.REVIEW_LESSON_SIZE, Object.assign({ finishTitle: "Review complete!" }, opts));
    const rx = app.querySelector("[data-review-extra]");
    if (rx) rx.onclick = () => Engine.startReview(8, Object.assign({ finishTitle: "Review complete!" }, opts), true);
    app.querySelectorAll("[data-toggle]").forEach(b => b.onclick = () => {
      const k = b.dataset.toggle; Store.data.settings[k] = !Store.data.settings[k]; Store.save(); this.render();
    });
    const ts = app.querySelector("[data-testsay]");
    if (ts) ts.onclick = () => Speech.say("Hello! I'm Mio. Let's learn English together!");
    const rs = app.querySelector("[data-reset]");
    if (rs) rs.onclick = () => {
      const d = app.querySelector(".dialog"); d.hidden = false;
      d.innerHTML = `<div class="dlg-box">${Mio.svg("encourage")}<p class="dlg-title">Wirklich alles löschen?</p>
        <p>XP, Tagesserie und alle gelernten Wörter sind dann weg.</p>
        <button class="btn primary big" data-no>Nein, behalten</button><button class="btn ghost" data-yes>Ja, löschen</button></div>`;
      d.querySelector("[data-no]").onclick = () => d.hidden = true;
      d.querySelector("[data-yes]").onclick = () => { Store.reset(); this.view = "home"; this.render(); };
    };
    PWA.bindBackup(app);
    const sk = app.querySelector("[data-skipday]");
    if (sk) sk.onclick = () => { TestTools.skipDay(); sk.textContent = "✓ Ein Tag vorgespult"; };
  }
};

/* Nur zum Testen: Zeit um einen Tag zurückdrehen */
const TestTools = {
  skipDay() {
    const d = Store.data;
    Object.values(d.words).forEach(s => { s.due -= 1; });
    if (d.lastLessonDay != null) d.lastLessonDay -= 1;
    if (d.lastPlayDay != null) d.lastPlayDay -= 1;
    const pd = {}; Object.keys(d.packsDone).forEach(k => pd[+k - 1] = d.packsDone[k]); d.packsDone = pd;
    if (d.app && d.app.shift) d.app.shift(1);
    Store.save();
  }
};

App.init();

</script>
</body>
</html>
